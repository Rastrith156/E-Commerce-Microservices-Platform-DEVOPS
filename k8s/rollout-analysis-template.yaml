apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: catalog-service-success-rate
  namespace: ecommerce
spec:
  args:
    - name: service-name
      value: catalog-service
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.99
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(
              rate(http_server_requests_seconds_count{service="{{args.service-name}",status=~"2.."}}[1m])
            ) /
            sum(
              rate(http_server_requests_seconds_count{service="{{args.service-name}"}[1m])
            )
