apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: rastrith/catalog-service
    newTag: staging
  - name: rastrith/cart-service
    newTag: staging
  - name: rastrith/order-service
    newTag: staging
  - name: rastrith/frontend
    newTag: staging
replicas:
  - name: catalog-service
    count: 2
  - name: cart-service
    count: 2
  - name: order-service
    count: 2
  - name: frontend
    count: 2
