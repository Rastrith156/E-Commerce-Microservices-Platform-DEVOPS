apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ecommerce-workload-security
policies:
  - ../workload-security.yaml
resources:
  - pod-compliant.yaml
  - pod-noncompliant.yaml
results:
  - policy: ecommerce-workload-security
    rule: approved-registry-and-immutable-digest
    resources:
      - compliant-app
    kind: Pod
    result: pass
  - policy: ecommerce-workload-security
    rule: restricted-container-security
    resources:
      - compliant-app
    kind: Pod
    result: pass
  - policy: ecommerce-workload-security
    rule: restricted-pod-security-context
    resources:
      - compliant-app
    kind: Pod
    result: pass
  - policy: ecommerce-workload-security
    rule: approved-registry-and-immutable-digest
    resources:
      - noncompliant-app
    kind: Pod
    result: fail
  - policy: ecommerce-workload-security
    rule: restricted-container-security
    resources:
      - noncompliant-app
    kind: Pod
    result: fail
  - policy: ecommerce-workload-security
    rule: restricted-pod-security-context
    resources:
      - noncompliant-app
    kind: Pod
    result: fail
