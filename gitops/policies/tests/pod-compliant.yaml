apiVersion: v1
kind: Pod
metadata:
  name: compliant-app
  namespace: ecommerce-dev
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: us-central1-docker.pkg.dev/PROJECT_ID/ecommerce/catalog-service@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
