apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: catalog-service
spec:
  replicas: 3
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-service
          image: catalog-service:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 5
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: ecommerce-slo-check
            args:
              - name: application
                value: catalog-service
              - name: prometheus-address
                value: http://PROMETHEUS_ENDPOINT_REQUIRED
        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: ecommerce-slo-check
            args:
              - name: application
                value: catalog-service
              - name: prometheus-address
                value: http://PROMETHEUS_ENDPOINT_REQUIRED
        - setWeight: 50
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: ecommerce-slo-check
            args:
              - name: application
                value: catalog-service
              - name: prometheus-address
                value: http://PROMETHEUS_ENDPOINT_REQUIRED
        - setWeight: 100
---
