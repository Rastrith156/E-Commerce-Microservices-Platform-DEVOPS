map $args $query_robots {
    "" "";
    default "noindex, follow";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    error_page 404 /404.html;

    location ^~ /api/products {
        proxy_pass http://catalog-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/carts/ {
        proxy_pass http://cart-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/payments/ {
        proxy_pass http://order-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /404.html {
        internal;
    }

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /shop {
        return 301 /shop/$is_args$args;
    }

    location = /shop/ {
        add_header X-Robots-Tag $query_robots always;
        try_files /shop/index.html =404;
    }

    location = /privacy {
        return 301 /privacy/$is_args$args;
    }

    location = /privacy/ {
        add_header X-Robots-Tag $query_robots always;
        try_files /privacy/index.html =404;
    }

    location = / {
        add_header X-Robots-Tag $query_robots always;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri =404;
    }
}
