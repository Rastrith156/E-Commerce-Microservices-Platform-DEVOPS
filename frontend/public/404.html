<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#f8f7f3">
    <title>Page Not Found | Northstar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
      :root{font-family:Arial,Helvetica,sans-serif;color:#23231f;background:#f8f7f3}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
      a{color:inherit;text-underline-offset:4px}
      a:focus-visible{outline:3px solid #145ec8;outline-offset:4px}
      header,footer{padding:22px max(24px,5vw);background:#fff;border-bottom:1px solid #d8d5cc}
      footer{border:0;border-top:1px solid #d8d5cc;color:#59584f;font-size:14px}
      .brand{font-weight:800;letter-spacing:.16em;text-decoration:none}
      .brand span{color:#a74721}
      main{width:min(760px,calc(100% - 40px));margin:auto;padding:70px 0}
      .code{color:#1f4d3c;font-size:12px;font-weight:700;letter-spacing:.13em}
      h1{max-width:680px;margin:16px 0;font:600 clamp(44px,8vw,78px)/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
      p{max-width:600px;color:#59584f;font-size:18px;line-height:1.65}
      .actions{display:flex;flex-wrap:wrap;align-items:center;gap:22px;margin-top:30px}
      .primary{min-height:50px;padding:15px 22px;display:inline-flex;align-items:center;background:#23231f;color:#fff;font-weight:700;text-decoration:none}
      .secondary{color:#173b2e;font-weight:700}
      @media(max-width:480px){main{padding:54px 0}.actions{align-items:flex-start;flex-direction:column;gap:16px}}
    </style>
  </head>
  <body>
    <header><a class="brand" href="/">NORTHSTAR<span>.</span></a></header>
    <main id="main-content">
      <p class="code">404 · PAGE NOT FOUND</p>
      <h1>This page took a wrong turn.</h1>
      <p>The address may be out of date, or the page may have moved. Head home or browse the collection to find your way.</p>
      <nav class="actions" aria-label="Helpful links">
        <a class="primary" href="/">Back to Home</a>
        <a class="secondary" href="/shop/">Browse the collection</a>
        <a class="secondary" href="/privacy/">Privacy policy</a>
      </nav>
    </main>
    <footer>Northstar · Considered everyday essentials</footer>
  </body>
</html>
