name: Branch CI

on:
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}

      - name: Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx

      - name: Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Frontend Production Build
        working-directory: frontend
        run: npm run build

      - name: Backend Maven Tests
        run: mvn test -B -pl services/catalog-service,services/cart-service,services/order-service

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Docker Build
        run: |
          docker build -t catalog-service:${{ github.sha }} ./services/catalog-service
          docker build -t cart-service:${{ github.sha }} ./services/cart-service
          docker build -t order-service:${{ github.sha }} ./services/order-service
          docker build -t frontend:${{ github.sha }} ./frontend

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image: 'catalog-service:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-image-catalog.sarif'

      - name: SBOM Generation
        run: |
          for img in catalog-service cart-service order-service frontend; do
            trivy image --format spdx --output "sbom-${img}.spdx" "${img}:${{ github.sha }}" || true
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: 'sbom-*.spdx'

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: 'trivy-*.sarif'
