name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}

      - name: Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Frontend Production Build
        working-directory: frontend
        run: npm run build

      - name: Backend Maven Tests
        run: mvn test -B -pl services/catalog-service,services/cart-service,services/order-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Catalog Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalog-service
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/catalog-service:${{ github.ref_name }}

      - name: Build and push Cart Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/cart-service
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/cart-service:${{ github.ref_name }}

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/order-service:${{ github.ref_name }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/frontend:${{ github.ref_name }}

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image: '${{ secrets.REGISTRY_URL }}/catalog-service:${{ github.ref_name }}'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-image-release.sarif'

      - name: SBOM Generation
        run: |
          for img in catalog-service cart-service order-service frontend; do
            trivy image --format spdx --output "sbom-${img}.spdx" "${{ secrets.REGISTRY_URL }}/${img}:${{ github.ref_name }}" || true
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms-release
          path: 'sbom-*.spdx'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom-*.spdx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
