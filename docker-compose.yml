services:
  # ---------------------------------------------------------------------------
  # Shared application database (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Catalog microservice
  # ---------------------------------------------------------------------------
  catalog-service:
    image: catalog-service:1.0.0
    container_name: catalog-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Cart microservice
  # ---------------------------------------------------------------------------
  cart-service:
    image: cart-service:1.0.0
    container_name: cart-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Order microservice
  # ---------------------------------------------------------------------------
  order-service:
    image: order-service:1.0.0
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
      SERVER_PORT: 8083
      PAYPAL_API_BASE_URL: https://api-m.sandbox.paypal.com
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Frontend (Nginx serving the built React app)
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: ecommerce-frontend
    depends_on:
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Jenkins (CI/CD controller)
  # ---------------------------------------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    user: root
    ports:
      - "18080:8080"
      - "50050:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # SonarQube (static analysis)
  # ---------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "19000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - ecommerce-network

  sonarqube-db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - ecommerce-network

volumes:
  jenkins_home:
  ecommerce_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgres_data:

networks:
  ecommerce-network:
    driver: bridge
